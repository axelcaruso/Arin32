<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Clipboard board -->
  <rect x="6" y="8" width="20" height="20" rx="2" fill="#9CA3AF" stroke="#6B7280" stroke-width="1.5"/>
  <!-- Paper on clipboard -->
  <rect x="9" y="11" width="14" height="15" rx="1" fill="#FFFFFF"/>
  <!-- Clipboard top clip -->
  <rect x="12" y="5" width="8" height="5" rx="1.5" fill="#4B5563"/>
  <!-- Text lines on paper -->
  <line x1="12" y1="16" x2="20" y2="16" stroke="#D1D5DB" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12" y1="20" x2="18" y2="20" stroke="#D1D5DB" stroke-width="1.5" stroke-linecap="round"/>
</svg>
